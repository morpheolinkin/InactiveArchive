<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Escola Quilombola</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <style>
        body {
            /* Centraliza o card de login na tela inteira */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(rgba(46, 139, 87, 0.1), rgba(139, 69, 19, 0.1));
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-top: 5px solid var(--cor-terra);
        }
        .logo-login {
            height: 100px;
            width: auto;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<div class="card card-custom login-card shadow-lg">
    <div class="card-body text-center p-4">

        <img th:src="@{/img/escolaQuilombo.png}" alt="Logo" class="logo-login">
        <h4 class="fw-bold text-secondary mb-1">Acesso Restrito</h4>
        <p class="small text-muted mb-4">Escola Mun. Quilombola Prof.ª Anísia Maria Rodrigues</p>

        <div th:if="${param.error}" class="alert alert-danger py-2 small">
            <i class="bi bi-exclamation-triangle-fill"></i> Usuário ou senha inválidos.
        </div>

        <div th:if="${param.logout}" class="alert alert-success py-2 small">
            Você saiu do sistema com segurança.
        </div>

        <form th:action="@{/login}" method="post">

            <div class="form-floating mb-3 text-start">
                <input type="text" class="form-control" id="username" name="username" placeholder="Usuário" required autofocus>
                <label for="username"><i class="bi bi-person-fill"></i> Usuário</label>
            </div>

            <div class="form-floating mb-3 text-start">
                <input type="password" class="form-control" id="password" name="password" placeholder="Senha" required>
                <label for="password"><i class="bi bi-lock-fill"></i> Senha</label>
            </div>

            <button type="submit" class="btn btn-lg btn-success w-100 mt-2"
                    style="background-color: var(--cor-natureza); border: none;">
                Entrar no Sistema
            </button>
        </form>

    </div>
    <div class="card-footer bg-light text-center py-3">
        <small class="text-muted">Desenvolvido por <strong>Jefferson Medeiros</strong></small>
    </div>
</div>

</body>
</html>
