<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arquivo de Alunos Inativos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="container mt-4">

<h1 class="mb-3">Arquivo de Alunos Inativos</h1>

<div class="row mb-3">
    <div class="col-md-4 d-flex gap-2"> <a th:href="@{/alunos/novo}" class="btn btn-primary flex-fill">
        <i class="bi bi-plus-circle"></i> Novo Aluno
    </a>

        <a th:href="@{/alunos/relatorio}" class="btn btn-danger flex-fill" target="_blank">
            <i class="bi bi-file-earmark-pdf"></i> Relatório PDF
        </a>

    </div>
    <div class="col-md-8">
        <form th:action="@{/alunos}" method="GET" class="d-flex">
            <input type="text" name="nome" class="form-control me-2"
                   placeholder="Pesquisar por nome..." th:value="${termoBusca}">
            <button type="submit" class="btn btn-outline-success">
                <i class="bi bi-search"></i> Buscar
            </button>
            <a th:if="${termoBusca != null}" th:href="@{/alunos}" class="btn btn-outline-secondary ms-2">Limpar</a>
        </form>
    </div>
</div>

<table class="table table-striped table-hover align-middle" th:if="${alunos != null && !#lists.isEmpty(alunos)}">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nome Completo</th>
        <th>CPF</th>
        <th>Data de Nascimento</th>
        <th>Ações</th> </tr>
    </thead>
    <tbody>
    <tr th:each="aluno : ${alunos}">
        <td th:text="${aluno.id}">1</td>
        <td th:text="${aluno.nome}">Nome</td>
        <td th:text="${aluno.cpf}">CPF</td>
        <td th:text="${#temporals.format(aluno.dataNascimento, 'dd/MM/yyyy')}">Data</td>

        <td>
            <a th:href="@{/alunos/editar/{id}(id=${aluno.id})}" class="btn btn-sm btn-warning me-1" title="Editar">
                <i class="bi bi-pencil"></i>
            </a>

            <a th:href="@{/alunos/excluir/{id}(id=${aluno.id})}"
               class="btn btn-sm btn-danger"
               title="Excluir"
               onclick="return confirm('Tem certeza que deseja excluir este aluno?');">
                <i class="bi bi-trash"></i>
            </a>
        </td>
    </tr>
    </tbody>
</table>

<div class="alert alert-info" th:if="${alunos == null || #lists.isEmpty(alunos)}">
    Nenhum aluno encontrado.
</div>

</body>
</html>
