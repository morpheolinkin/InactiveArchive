<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arquivo de Alunos Inativos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="container mt-4">

<h1 class="mb-3">Arquivo de Alunos Inativos</h1>

<a th:href="@{/alunos/novo}" class="btn btn-primary mb-3">Cadastrar Novo Aluno</a>

<table class="table table-striped table-hover" th:if="${alunos != null && !#lists.isEmpty(alunos)}">
    <thead class="table-dark">
    <tr>
        <th>ID (Localizador)</th>
        <th>Nome Completo</th>
        <th>CPF</th>
        <th>Data de Nascimento</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="aluno : ${alunos}">
        <td th:text="${aluno.id}">1</td>
        <td th:text="${aluno.nome}">Nome do Aluno</td>
        <td th:text="${aluno.cpf}">123.456.789-00</td>
        <td th:text="${#temporals.format(aluno.dataNascimento, 'dd/MM/yyyy')}">01/01/2000</td>
    </tr>
    </tbody>
</table>

<div class="alert alert-info" th:if="${alunos == null || #lists.isEmpty(alunos)}">
    Nenhum aluno cadastrado no momento.
</div>

</body>
</html>
