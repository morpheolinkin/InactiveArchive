<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="container mt-4">

<h1 class="mb-3" th:text="${aluno.id == null} ? 'Novo Cadastro' : 'Editar Aluno'">Formulário</h1>

<form th:action="@{/alunos/salvar}" th:object="${aluno}" method="POST">

    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label for="nome" class="form-label">Nome Completo:</label>
        <input type="text" th:field="*{nome}" id="nome" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="cpf" class="form-label">CPF:</label>
        <input type="text" th:field="*{cpf}" id="cpf" class="form-control"
               th:errorclass="is-invalid" required>

        <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}">
            Erro no CPF
        </div>
    </div>

    <div class="mb-3">
        <label for="dataNascimento" class="form-label">Data de Nascimento:</label>
        <input type="date" th:field="*{dataNascimento}" id="dataNascimento" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-success">Salvar Aluno</button>
    <a th:href="@{/alunos}" class="btn btn-secondary">Cancelar</a>

</form>

</body>
</html>
