<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ocorreu um Erro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card shadow-lg p-4 border-0" style="max-width: 500px; width: 100%;">
    <div class="text-center text-danger mb-3">
        <i class="bi bi-exclamation-triangle-fill" style="font-size: 4rem;"></i>
    </div>

    <h2 class="text-center mb-2" th:text="${titulo}">Erro</h2>
    <h4 class="text-center text-muted mb-4" th:text="'Código: ' + ${status}">400</h4>

    <div class="alert alert-danger" role="alert">
        <strong th:text="${mensagem}">Mensagem de erro aqui...</strong>
    </div>

    <ul class="list-group list-group-flush small text-secondary mb-4">
        <li class="list-group-item bg-transparent">
            <strong>Data/Hora:</strong> <span th:text="${timestamp}">01/01/2024 12:00:00</span>
        </li>
        <li class="list-group-item bg-transparent">
            <strong>Caminho:</strong> <span th:text="${path}">/caminho/do/erro</span>
        </li>
    </ul>

    <div class="d-grid gap-2">
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Voltar</a>
        <a th:href="@{/alunos}" class="btn btn-primary">Ir para a Página Inicial</a>
    </div>
</div>

</body>
</html>
